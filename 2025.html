<body onresize="u()">
  <main>
    <textarea id="t" oninput="u()"></textarea>
    <canvas id="v"></canvas>
  </main>
  <style>
    #t {
      color: transparent;
      background: none;
      width: 100%;
      height: 200px;
      resize: none;
    }
    main {
      position: relative;
    }
    #v {
      position: absolute;
      top: 0;
      left: 0;
      pointer-events: none;
    }
  </style>
  <script>
    let d = document;
    let $ = d.querySelector.bind(d);
    /**
     * @type CanvasRenderingContext2D
     */
    let c = v.getContext("2d");
    function u() {
      v.width = t.clientWidth;
      v.height = t.clientHeight;
      c.reset();
      c.font = "bold 48px serif";
      c.fillText(t.value, 0, 0);
    }
    u();
  </script>
</body>
